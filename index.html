<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6A7C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشغل المجد">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>مشغل المجد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout concept: single-column mobile app. Sticky header, month bar, cards, bottom tab bar, bottom-sheet forms. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface2:#E9EEF2; --fg:#13202A; --muted:#556675; --line:#D6DEE4;
  --accent:#0B6A7C; --accent-fg:#FFFFFF; --accent-soft:#D9EEF2; --good:#17744A; --bad:#B42318; --input:#F7F9FA;
  --c1:#0B6A7C; --c2:#7A5AC8; --c3:#C27E14; --c4:#7C8B98; --c5:#C2492F;
  --f-head:'Cairo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Cairo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1519; --surface:#172027; --surface2:#1F2A32; --fg:#E6EDF2; --muted:#9AABB8; --line:#2A3843;
    --accent:#4FC3D8; --accent-fg:#06222A; --accent-soft:#153841; --good:#4CC38A; --bad:#FF8A80; --input:#101A20;
    --c1:#4FC3D8; --c2:#A58DEB; --c3:#E5A94A; --c4:#8FA0AD; --c5:#EE7A5E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1519; --surface:#172027; --surface2:#1F2A32; --fg:#E6EDF2; --muted:#9AABB8; --line:#2A3843;
  --accent:#4FC3D8; --accent-fg:#06222A; --accent-soft:#153841; --good:#4CC38A; --bad:#FF8A80; --input:#101A20;
  --c1:#4FC3D8; --c2:#A58DEB; --c3:#E5A94A; --c4:#8FA0AD; --c5:#EE7A5E; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;min-height:100%}
body.lock{overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.25}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.u{font-size:.8em;color:var(--muted);margin-inline-start:.25em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.top h1{font-size:1.35rem;font-weight:800}
.chip{font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--surface2);color:var(--bad)}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.monthbar{display:flex;align-items:center;gap:10px}
.monthbar label{color:var(--muted);font-size:.9rem}
input,select{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
.monthbar input{width:auto;flex:1}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:1.05rem;font-weight:800}
.hero{background:var(--accent);color:var(--accent-fg);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:2px}
.hero .lab{font-size:.9rem;opacity:.9}
.hero .big{font-family:var(--f-head);font-weight:800;font-size:2rem;line-height:1.2}
.hero .sub{font-size:.85rem;opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .lab{color:var(--muted);font-size:.82rem}
.tile .val{font-family:var(--f-head);font-weight:800;font-size:1.2rem}
.good{color:var(--good)} .bad{color:var(--bad)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.stack i{display:block;height:100%}
.leg{display:flex;flex-direction:column;gap:6px}
.leg .r{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.leg .sw{width:12px;height:12px;border-radius:3px}
.leg .pc{color:var(--muted);font-size:.85rem;min-width:3.2em;text-align:end}
.minis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mini{background:var(--surface2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.mini .lab{color:var(--muted);font-size:.78rem}
.mini .val{font-weight:600}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.phead h3{font-size:1.05rem;font-weight:800}
.muted{color:var(--muted);font-size:.88rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn.wide{width:100%}
.btn:disabled{opacity:.6}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;min-width:0;text-align:start;width:100%}
button.item{cursor:pointer}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{color:var(--muted);font-size:.85rem;grid-column:1}
.item .a{font-weight:600;text-align:end}
.item .x{grid-column:2;grid-row:2;justify-self:end}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-inline-start:6px;vertical-align:middle}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:4px}
.empty b{font-family:var(--f-head)}
.note{background:var(--accent-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:.9rem}
.lines{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.lines .l{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.lines .l span:first-child{min-width:0;overflow-wrap:anywhere}
.lines .tot{color:var(--fg);font-weight:600;border-top:1px solid var(--line);padding-top:4px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.74rem;min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
#sheet[hidden]{display:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);color:var(--fg);border-radius:18px 18px 0 0;max-height:90dvh;overflow:auto;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.ph{display:flex;justify-content:space-between;align-items:center}
.ph h2{font-size:1.15rem;font-weight:800}
.ph .x{border:0;background:var(--surface2);width:36px;height:36px;border-radius:50%;font-size:1.3rem;cursor:pointer;line-height:1}
.fields{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span{font-size:.85rem;color:var(--muted)}
.fld small,.chk small{color:var(--muted);font-size:.78rem}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{width:22px;min-height:22px;height:22px;margin-top:2px;flex:none}
.chk span{display:flex;flex-direction:column}
.prev{font-size:.9rem;color:var(--accent);min-height:0}
.err{color:var(--bad);font-size:.9rem}
.pf{display:flex;gap:10px}
.pf .primary{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;z-index:30;font-size:.9rem;max-width:90%}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (min-width:700px){main,.top,.monthbar{max-width:640px;margin-inline:auto;width:100%}.tabs{padding-inline:calc(50% - 320px)}.panel{max-width:640px;margin-inline:auto}}
</style>
</head>
<body>

<div class="top"><h1>مشغل المجد</h1><span id="sync" class="chip">بيحمّل…</span></div>
<main id="view"></main>
<nav class="tabs" id="tabs" aria-label="التنقل"></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>
<input type="file" id="impfile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
document.documentElement.lang='ar';document.documentElement.dir='rtl';

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
var M=function(n){var r=Math.round((+n||0)*100)/100+0;return '<bdi class="num">'+nf.format(r)+'</bdi>'};
var INT=function(n){return '<bdi class="num">'+nf.format((+n||0)+0)+'</bdi>'};
var PCT=function(n){var r=Math.round((+n||0)*1000)/10+0;return '<bdi class="num">'+nf.format(r)+'%</bdi>'};
var EGP='<span class="u">ج.م</span>';
var sum=function(a,f){return a.reduce(function(s,x){return s+(+f(x)||0)},0)};
var uid=function(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)};
var pad=function(n){return (n<10?'0':'')+n};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var dshort=function(d){return d?'<bdi class="num">'+esc(d.slice(8,10)+'/'+d.slice(5,7))+'</bdi>':''};

/* ---------- data ---------- */
var DEFAULTS={
  materials:[
    {id:'m1',name:'توب قماش',unit:'توب',price:4500,isRoll:true},
    {id:'m2',name:'شنطة',unit:'قطعة',price:8,isRoll:false},
    {id:'m3',name:'خيط',unit:'بكرة',price:40,isRoll:false},
    {id:'m4',name:'فرانشات',unit:'قطعة',price:15,isRoll:false}
  ],
  products:[
    {id:'p1',name:'دفاية 4 قطع',perRoll:18,price:600,use:{m2:1,m3:0.1,m4:2}},
    {id:'p2',name:'دفاية لوكس',perRoll:18,price:900,use:{m2:1,m3:0.1,m4:4}},
    {id:'p3',name:'دفاية أطفال 6 قطع',perRoll:29,price:750,use:{m2:1,m3:0.1,m4:2}}
  ]
};
var COLS=['production','sales','expenses','workers'];
var data={settings:null,production:[],sales:[],expenses:[],workers:[]};
var db=null, mode='wait', LS='majd-workshop-v1';
var month=today().slice(0,7);
var TABS=[
  ['summary','الملخص','<path d="M4 20V11M10 20V5M16 20v-6M3 20h18"/>'],
  ['materials','الخامات','<path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10"/>'],
  ['production','الإنتاج','<path d="M3 21V9l6 4V9l6 4V5h6v16H3z"/>'],
  ['sales','المبيعات','<path d="M3 4h2l2.5 11h11L21 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>'],
  ['payroll','المرتبات','<path d="M16 20v-1a4 4 0 00-4-4H7a4 4 0 00-4 4v1M9.5 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM21 20v-1a4 4 0 00-3-3.9M15 4.2a3.5 3.5 0 010 6.6"/>']
];
var tab='summary';
var S=function(){return data.settings||DEFAULTS};
var roll=function(){return S().materials.filter(function(m){return m.isRoll})[0]||null};
var prodById=function(id){return S().products.filter(function(p){return p.id===id})[0]||null};
var perRollCost=function(p){var r=roll();return r&&p.perRoll>0?r.price/p.perRoll:0};
var extraCost=function(p){return sum(S().materials.filter(function(m){return !m.isRoll}),function(m){return m.price*((p.use&&+p.use[m.id])||0)})};
var stdCost=function(p){return perRollCost(p)+extraCost(p)};
var entryCost=function(e){var p=prodById(e.productId);if(!p)return 0;var r=roll();
  if(e.rolls>0&&r)return e.rolls*r.price+e.pieces*extraCost(p);return e.pieces*stdCost(p)};
var unitPriceOf=function(e,p){return e.unitPrice>0?e.unitPrice:(p?p.price:0)};

function loadLocal(){try{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j){COLS.forEach(function(c){if(Array.isArray(j[c]))data[c]=j[c]});data.settings=j.settings||null}}catch(e){}}
function persist(){try{localStorage.setItem(LS,JSON.stringify(data))}catch(e){}}

function explain(x){if(x&&x.userMsg)return x.userMsg;var c=x&&x.code;
  if(c==='invalid_argument')return 'مفيش صلاحية تعديل على الصفحة دي. اطلب صلاحية Contributor أو أعلى.';
  if(c==='quota_exceeded')return 'مساحة التخزين اتملت.';
  return 'حصلت مشكلة في الحفظ. جرّب تاني.'}
var cfg=null,queue=[],seq=0,syncing=false;
try{cfg=JSON.parse(localStorage.getItem('majd-sync-v1')||'null')}catch(e){cfg=null}
try{queue=JSON.parse(localStorage.getItem('majd-queue-v1')||'[]')}catch(e){queue=[]}
if(!Array.isArray(queue))queue=[];
function saveQueue(){try{localStorage.setItem('majd-queue-v1',JSON.stringify(queue))}catch(e){}}
function enq(op){seq++;if(cfg){queue.push(op);saveQueue();if(mode!=='ok')mode='wait';sync()}}
async function addDoc(c,o){var id=uid();data[c].push(Object.assign({id:id},o));persist();enq({t:'set',c:c,id:id,o:o});render()}
async function setDoc(c,id,o){data[c]=data[c].map(function(x){return x.id===id?Object.assign({id:id},o):x});persist();enq({t:'set',c:c,id:id,o:o});render()}
async function delDoc(c,id){data[c]=data[c].filter(function(x){return x.id!==id});persist();enq({t:'del',c:c,id:id});render()}
async function saveSettings(s){data.settings=s;persist();enq({t:'settings',o:s});render()}

/* ---------- Google Drive sync (Apps Script) ---------- */
async function call(ops){
  var ac=new AbortController(),t=setTimeout(function(){ac.abort()},25000);
  try{
    var r=await fetch(cfg.u,{method:'POST',body:JSON.stringify({key:cfg.k,ops:ops}),signal:ac.signal});
    var j=await r.json();
    if(!j.ok){var e=new Error(j.error);e.auth=(j.error==='auth');throw e}
    return j.state;
  }finally{clearTimeout(t)}
}
function applyState(st){
  data.settings=st.settings||null;
  COLS.forEach(function(c){data[c]=Array.isArray(st[c])?st[c]:[]});
  persist();
}
async function sync(){
  if(!cfg||syncing)return;
  syncing=true;
  try{
    for(;;){
      var s0=seq,ops=queue.slice(0);
      var st=await call(ops);
      queue.splice(0,ops.length);saveQueue();
      if(queue.length||seq!==s0)continue;
      applyState(st);break;
    }
    mode='ok';
  }catch(e){mode=(e&&e.auth)?'auth':'late'}
  syncing=false;render();
}
var clone=function(o){return JSON.parse(JSON.stringify(o))};

/* ---------- calculations ---------- */
function summary(m){
  var inM=function(e){return (e.date||'').indexOf(m)===0};
  var pr=data.production.filter(inM), sa=data.sales.filter(inM), ex=data.expenses.filter(inM);
  var salaries={w:0,s:0,o:0};
  data.workers.forEach(function(w){var k=w.dept==='مشغل'?'w':w.dept==='مخزن'?'s':'o';salaries[k]+=(+w.salary||0)});
  var salTotal=salaries.w+salaries.s+salaries.o, other=sum(ex,function(e){return e.amount});
  var overhead=salTotal+other;
  var rows=S().products.map(function(p){
    var made=sum(pr.filter(function(e){return e.productId===p.id}),function(e){return e.pieces});
    var mats=sum(pr.filter(function(e){return e.productId===p.id}),entryCost);
    var sold=sum(sa.filter(function(e){return e.productId===p.id}),function(e){return e.qty});
    var rev=sum(sa.filter(function(e){return e.productId===p.id}),function(e){return e.qty*unitPriceOf(e,p)});
    return {p:p,made:made,mats:mats,sold:sold,rev:rev};
  });
  var totalMade=sum(rows,function(r){return r.made});
  rows.forEach(function(r){
    r.alloc=totalMade?overhead*r.made/totalMade:0;
    r.total=r.mats+r.alloc;
    r.unit=r.made?r.total/r.made:stdCost(r.p);
    r.cogs=r.sold*r.unit; r.profit=r.rev-r.cogs; r.margin=r.rev?r.profit/r.rev:0;
  });
  var mats=sum(rows,function(r){return r.mats}), rev=sum(rows,function(r){return r.rev});
  var spend=mats+salTotal+other;
  var cogs=sum(rows,function(r){return r.cogs});
  var unallocated=totalMade?0:overhead;
  return {rows:rows,salaries:salaries,salTotal:salTotal,other:other,mats:mats,rev:rev,spend:spend,net:rev-spend,
    profit:rev-cogs-unallocated,unsold:sum(rows,function(r){return r.total})-cogs,unallocated:unallocated,totalMade:totalMade};
}

/* ---------- views ---------- */
function monthBar(){return '<div class="monthbar"><label for="month">الشهر</label><input type="month" id="month" value="'+esc(month)+'"></div>'}
function empty(t,h){return '<div class="empty"><b>'+esc(t)+'</b><span class="muted">'+esc(h)+'</span></div>'}
function armBtn(col,id){var k=col+':'+id,on=armed===k;return '<button class="btn danger sm x'+(on?' armed':'')+'" data-act="del" data-col="'+col+'" data-id="'+esc(id)+'">'+(on?'تأكيد الحذف':'حذف')+'</button>'}
var armed=null;

function vSummary(){
  var s=summary(month), out=[monthBar()];
  if(!data.settings)out.push('<div class="note">أسعار الخامات والمنتجات الحالية أمثلة. روح تاب «الخامات» وعدّلها بأسعارك.</div>');
  out.push('<div class="hero"><span class="lab">صافي النقدية (إيراد − مصروف)</span><span class="big '+(s.net<0?'':'')+'">'+(s.net<0?'−':'')+M(Math.abs(s.net))+' <span class="u" style="color:inherit">ج.م</span></span><span class="sub">'+(s.net<0?'خارج أكتر من الداخل في الشهر ده':'داخل أكتر من الخارج في الشهر ده')+'</span></div>');
  out.push('<div class="tiles"><div class="tile"><span class="lab">إيراد المبيعات</span><span class="val">'+M(s.rev)+'</span></div>'+
    '<div class="tile"><span class="lab">إجمالي المصروف</span><span class="val">'+M(s.spend)+'</span></div>'+
    '<div class="tile"><span class="lab">'+(s.profit<0?'خسارة البيع':'ربح البيع')+'</span><span class="val '+(s.profit<0?'bad':'good')+'">'+M(Math.abs(s.profit))+'</span></div></div>');

function fieldHtml(f){

  if(f.type==='select')return '<label class="fld"><span>'+esc(f.label)+'</span><select id="'+id+'">'+f.options.map(function(o){return '<option value="'+esc(o.value)+'"'+(o.value===f.value?' selected':'')+'>'+esc(o.label)+'</option>'}).join('')+'</select></label>';
  if(f.type==='checkbox')return '<label class="chk"><input type="checkbox" id="'+id+'"'+(f.value?' checked':'')+'><span>'+esc(f.label)+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</span></label>';
  var num=f.type==='number';
  return '<label class="fld"><span>'+esc(f.label)+'</span><input id="'+id+'" type="'+(num?'number':(f.type||'text'))+'"'+(num?' inputmode="decimal" step="any" min="0"':'')+' value="'+esc(f.value==null?'':f.value)+'" placeholder="'+esc(f.ph||'')+'" autocomplete="off">'+(f.hint?'<small>'+esc(f.hint)+'</small>':'')+'</label>';

function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML='';document.body.classList.remove('lock')}
function openSheet(o){
  var sh=$('#sheet');
  sh.innerHTML='<div class="scrim" data-act="close"></div><form class="panel" id="sf" novalidate><div class="ph"><h2>'+esc(o.title)+'</h2><button type="button" class="x" data-act="close" aria-label="إغلاق">×</button></div><div class="fields">'+o.fields.map(fieldHtml).join('')+'</div><div class="prev" id="prev"></div><div class="err" id="err" role="alert"></div><div class="pf">'+(o.onDelete?'<button type="button" class="btn danger" id="sdel">حذف</button>':'')+'<button class="btn primary" type="submit">'+esc(o.cta||'حفظ')+'</button></div></form>';
  sh.hidden=false;document.body.classList.add('lock');
  var form=$('#sf'), err=$('#err');
  var get=function(){var v={};o.fields.forEach(function(f){var e=document.getElementById('f_'+f.id);
    if(f.type==='checkbox')v[f.id]=e.checked;else if(f.type==='number'){var n=parseFloat(e.value);v[f.id]=isFinite(n)?n:null}else v[f.id]=e.value.trim()});return v};
  var set=function(id,val){document.getElementById('f_'+id).value=val};
  var prev=function(h){$('#prev').innerHTML=h};
  form.addEventListener('submit',async function(ev){ev.preventDefault();var v=get(),msg=o.validate?o.validate(v):'';
    if(msg){err.textContent=msg;return}
    var b=form.querySelector('.primary');b.disabled=true;err.textContent='';
    try{await o.onSave(v);closeSheet();toast('اتحفظ')}catch(x){err.textContent=explain(x);b.disabled=false}});
  if(o.onInput)form.addEventListener('input',function(ev){o.onInput(get,set,prev,ev.target.id)});
  if(o.onDelete){var armedDel=false,d=$('#sdel');d.addEventListener('click',async function(){
    if(!armedDel){armedDel=true;d.textContent='تأكيد الحذف';d.classList.add('armed');return}
    try{await o.onDelete();closeSheet();toast('اتحذف')}catch(x){err.textContent=explain(x)}})}
  var first=form.querySelector('input,select');if(first&&first.type!=='date')first.focus();
  if(o.onInput)o.onInput(get,set,prev,'init');
}

  var others=st.materials.filter(function(m){return !m.isRoll});
  var fields=[{id:'name',label:'اسم المنتج',type:'text',value:p&&p.name},
    {id:'perRoll',label:'عدد القطع اللي بتطلع من التوب الواحد',type:'number',value:p&&p.perRoll,hint:'تقريبي، مثلاً 18 أو 29'},
    {id:'price',label:'سعر بيع القطعة (جنيه)',type:'number',value:p&&p.price}];
  others.forEach(function(m){fields.push({id:'use_'+m.id,label:m.name+' لكل قطعة ('+(m.unit||'وحدة')+')',type:'number',value:p&&p.use?p.use[m.id]:null,ph:'0'})});
  openSheet({title:p?'تعديل منتج':'منتج جديد',fields:fields,
    validate:function(v){if(!v.name)return 'اكتب اسم المنتج';if(roll()&&!(v.perRoll>0))return 'اكتب عدد القطع من التوب';if(v.price===null)return 'اكتب سعر البيع';return ''},
    onSave:function(v){var use={};others.forEach(function(m){var q=v['use_'+m.id];if(q>0)use[m.id]=q});
      var o={name:v.name,perRoll:v.perRoll||0,price:v.price,use:use};
      if(p)Object.assign(p,o);else{o.id=uid();st.products.push(o)}
      return saveSettings(st)},
    onDelete:p?function(){st.products=st.products.filter(function(x){return x.id!==p.id});return saveSettings(st)}:null});
}

/* ---------- events ---------- */
document.addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='close')closeSheet();
  else if(a==='export')exportData();
  else if(a==='import')$('#impfile').click();
  else if(a==='link')openLink();
  else if(a==='share-link')openShare();
  else if(a==='unlink')openUnlink();
  else if(a==='add-prod')openProduction();
  else if(a==='add-sale')openSale();
  else if(a==='add-exp')openExpense();
  else if(a==='add-worker')openWorker();
  else if(a==='edit-worker')openWorker(id);
  else if(a==='add-mat')openMaterial();
  else if(a==='edit-mat')openMaterial(id);
  else if(a==='add-product')openProductEdit();
  else if(a==='edit-product')openProductEdit(id);
  else if(a==='del'){
    var k=b.dataset.col+':'+id;
    if(armed!==k){armed=k;render();setTimeout(function(){if(armed===k){armed=null;render()}},4000)}
    else{armed=null;try{await delDoc(b.dataset.col,id);toast('اتحذف')}catch(x){toast(explain(x));render()}}
  }
});
document.addEventListener('change',function(e){if(e.target.id==='month'&&e.target.value){month=e.target.value;render()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
function readHash(){var h=location.hash.slice(1);tab=VIEWS[h]?h:'summary';armed=null;render();window.scrollTo(0,0)}
window.addEventListener('hashchange',readHash);


/* ---------- Drive link UI ---------- */
function b64e(o){return btoa(JSON.stringify(o))}
function b64d(s){try{return JSON.parse(atob(String(s).trim()))}catch(e){return null}}
function openLink(){
  openSheet({title:'ربط جوجل درايف',cta:'ربط',fields:[
    {id:'code',label:'كود الربط (لو معاك من موبايل تاني)',type:'text',hint:'لو لصقته مش محتاج تكتب الرابط والكود السري.'},
    {id:'url',label:'رابط الـ Web App',type:'text',ph:'https://script.google.com/macros/s/.../exec'},
    {id:'key',label:'الكود السري',type:'text'}],
    validate:function(v){
      if(v.code){var c=b64d(v.code);return (c&&c.u&&c.k)?'':'كود الربط غير صحيح'}
      if(!/^https:\/\/script\.google\.com\//.test(v.url))return 'الرابط لازم يبدأ بـ https://script.google.com/';
      if(!v.key)return 'اكتب الكود السري';return ''},
    onInput:function(get,set,prev){prev('لو الموبايل ده فيه بيانات هتترفع وتتضاف على الموجود في الدرايف.')},
    onSave:async function(v){
      var c=v.code?b64d(v.code):{u:v.url,k:v.key},old=cfg;
      cfg={u:c.u,k:c.k};
      try{await call([])}catch(e){cfg=old;throw {userMsg:e&&e.auth?'الكود السري غلط.':'مقدرش يوصل للرابط. اتأكد من الرابط ومن إن النشر مضبوط على Anyone.'}}
      try{localStorage.setItem('majd-sync-v1',JSON.stringify(cfg))}catch(e){}
      queue=[];
      COLS.forEach(function(col){data[col].forEach(function(r){var o=Object.assign({},r);delete o.id;queue.push({t:'set',c:col,id:r.id,o:o})})});
      if(data.settings)queue.push({t:'settings',o:data.settings});
      saveQueue();seq++;mode='wait';sync();render();
    }});
}
function openShare(){
  var code=b64e(cfg);
  openSheet({title:'كود الربط',cta:'نسخ الكود',fields:[
    {id:'code',label:'الصق الكود ده في «ربط جوجل درايف» على الموبايل التاني',type:'text',value:code,hint:'الكود ده سري، متبعتوش لحد غريب.'}],
    onSave:async function(){try{await navigator.clipboard.writeText(code)}catch(e){throw {userMsg:'انسخ الكود من الخانة بإيدك.'}}}});
}
function openUnlink(){
  openSheet({title:'فصل جوجل درايف',cta:'فصل',fields:[],
    onInput:function(get,set,prev){prev('البيانات هتفضل على الموبايل ده ومش هتتزامن. الملف في الدرايف بيفضل زي ما هو.')},
    onSave:async function(){cfg=null;queue=[];try{localStorage.removeItem('majd-sync-v1');localStorage.removeItem('majd-queue-v1')}catch(e){}mode='local';render()}});
}

/* ---------- backup ---------- */
function exportData(){
  var blob=new Blob([JSON.stringify({app:'majd-workshop',v:1,date:today(),data:data},null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='majd-workshop-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);toast('تم تجهيز النسخة الاحتياطية');
}
document.addEventListener('change',function(e){
  if(e.target.id!=='impfile'||!e.target.files[0])return;
  var f=e.target.files[0],rd=new FileReader();
  rd.onload=function(){
    var j;try{j=JSON.parse(rd.result)}catch(x){j=null}
    if(!j||j.app!=='majd-workshop'||!j.data){toast('الملف ده مش نسخة احتياطية صحيحة');return}
    openSheet({title:'استيراد نسخة احتياطية',cta:'استبدال البيانات',fields:[],
      onInput:function(get,set,prev){prev('هيتم استبدال كل البيانات الحالية بنسخة '+esc(j.date||'')+'.')},
      onSave:function(){COLS.forEach(function(c){data[c]=Array.isArray(j.data[c])?j.data[c]:[]});data.settings=j.data.settings||null;persist();render()}});
  };
  rd.readAsText(f);e.target.value='';
});

/* ---------- start ---------- */
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
loadLocal();readHash();
setInterval(function(){if(cfg&&!document.hidden)sync()},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)sync()});
window.addEventListener('online',function(){sync()});
(async function(){
  var dbx=null;
  try{dbx=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){dbx=null}
  if(!dbx){mode=cfg?'wait':'local';render();if(cfg)sync();return}
  db=dbx;data={settings:null,production:[],sales:[],expenses:[],workers:[]};
  var ready={},need=COLS.length+1,timer=setTimeout(function(){if(mode==='wait'){mode='late';render()}},10000);
  var mark=function(k,snap){if(!snap.metadata.fromCache){ready[k]=true;if(Object.keys(ready).length>=need){clearTimeout(timer);mode='ok'}}};
  var fail=function(){clearTimeout(timer);mode='late';render()};
  COLS.forEach(function(c){db.collection(c).onSnapshot(function(snap){
    data[c]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});mark(c,snap);render()},fail)});
  db.doc('app/settings').onSnapshot(function(snap){data.settings=snap.exists?snap.data():null;mark('settings',snap);render()},fail);
  render();
})();
})();
</script>
